[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.2.0"
description = "Research harness for agent runners: every claim shows how it was checked."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
gauntlet-mcp = "gauntlet.mcp.tools:serve"

[tool.setuptools.packages.find]
include = ["gauntlet*"]

[tool.setuptools.package-data]
gauntlet = ["profiles/*.md", "packs/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
