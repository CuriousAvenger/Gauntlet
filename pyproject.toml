[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.1.0"
description = "A research assistant where every claim shows how it was checked."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
gauntlet = "gauntlet.cli.main:main"

[tool.setuptools.packages.find]
include = ["gauntlet*"]

[tool.setuptools.package-data]
gauntlet = ["core/*.md", "core/roles/*.md", "profiles/*.md", "packs/*/*.md", "packs/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
